<script type="module">
import { db, CONFIGURED, esc, markdown, fmtDate, revealOn, notConfiguredHTML } from "./app.js";

const main = document.getElementById("main");
const slug = new URLSearchParams(location.search).get("post");

function shell(inner) { main.innerHTML = inner; }

if (!CONFIGURED) {
  shell(`<div class="narrow" style="padding:80px 0">${notConfiguredHTML()}</div>`);
} else if (slug) {
  await renderPost(slug);
} else {
  await renderList();
}

// ---------------------------------------------------------------- list
async function renderList() {
  shell(`
    <header class="hero hero--sm">
      <div class="wrap">
        <p class="eyebrow">Writing</p>
        <h1>文<em>章</em></h1>
      </div>
    </header>
    <section class="sec sec--tight">
      <div class="wrap"><div id="list" class="posts" aria-live="polite">
        <div class="state">載入中…</div>
      </div></div>
    </section>`);

  const box = document.getElementById("list");
  const { data, error } = await db
    .from("posts")
    .select("slug,title,excerpt,tags,created_at")
    .eq("published", true)
    .order("created_at", { ascending: false });

  if (error) {
    box.innerHTML = `<div class="state">載入失敗：${esc(error.message)}</div>`;
    return;
  }
  if (!data.length) {
    box.innerHTML = `<div class="state">還沒有文章</div>`;
    return;
  }
  box.innerHTML = data.map((p) => `
    <a class="post-row rv" href="./blog.html?post=${encodeURIComponent(p.slug)}">
      <div class="post-row__date">${fmtDate(p.created_at)}</div>
      <div>
        <h3>${esc(p.title)}</h3>
        ${p.excerpt ? `<p>${esc(p.excerpt)}</p>` : ""}
        <div class="tags">${(p.tags || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>
      </div>
    </a>`).join("");
  revealOn();
}

// ---------------------------------------------------------------- post
async function renderPost(slug) {
  shell(`<div class="state">載入中…</div>`);

  const { data, error } = await db
    .from("posts")
    .select("slug,title,excerpt,content,tags,created_at,updated_at")
    .eq("slug", slug)
    .eq("published", true)
    .maybeSingle();

  if (error) {
    shell(`<div class="state">載入失敗：${esc(error.message)}</div>`);
    return;
  }
  if (!data) {
    shell(`
      <div class="narrow" style="padding:clamp(60px,10vw,120px) 0;text-align:center">
        <h1 style="font-family:var(--serif);font-size:clamp(32px,6vw,64px);margin:0 0 16px">找不到這篇文章</h1>
        <p style="color:var(--ink-60);margin:0 0 28px">它可能還是草稿，或網址打錯了。</p>
        <a class="btn btn--fill" href="./blog.html">回文章列表</a>
      </div>`);
    return;
  }

  document.title = `${data.title} — 王宇錡 Max Wang`;
  const edited = data.updated_at && data.updated_at.slice(0, 10) !== data.created_at.slice(0, 10);

  shell(`
    <article class="article">
      <div class="narrow">
        <p class="article__meta">
          ${fmtDate(data.created_at)}${edited ? ` · 更新於 ${fmtDate(data.updated_at)}` : ""}
        </p>
        <h1>${esc(data.title)}</h1>
        ${data.excerpt ? `<p class="article__lede">${esc(data.excerpt)}</p>` : ""}
        <div class="prose">${markdown(data.content)}</div>
        <div class="tags" style="margin-top:36px">
          ${(data.tags || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}
        </div>
        <div class="btns" style="margin-top:44px;padding-top:28px;border-top:1.5px solid var(--ink-12)">
          <a class="btn btn--ghost" href="./blog.html"><span aria-hidden="true">←</span> 所有文章</a>
        </div>
      </div>
    </article>`);
}
</script>
