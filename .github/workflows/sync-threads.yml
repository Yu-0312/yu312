# 每天自動把 Threads 貼文同步到網站（data.js + assets/threads/）
# 預設不需 API key：用 Playwright 抓公開頁（合併既有貼文）。
# 若有 secrets.THREADS_ACCESS_TOKEN 則改走官方 API，可補齊完整歷史。
name: Sync Threads

on:
  schedule:
    # 每天 16:10 UTC（台北 00:10）
    - cron: "10 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-threads
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Sync Threads posts
        env:
          # 可選：有設定才走官方 API；沒有就用瀏覽器抓公開頁
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node scripts/sync_threads.mjs

      # 新貼文由 AI 依內容分類（需要 repo secret ANTHROPIC_API_KEY；沒設就略過，新貼文會先顯示在「未分類」）
      - name: Classify new posts with AI
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/classify_posts.mjs

      # 新貼文自動翻成英文（需要 repo secret ANTHROPIC_API_KEY；沒設就略過，英文模式會顯示中文原文）
      - name: Translate new posts to English
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/translate_new.mjs
          node scripts/build_i18n.mjs --lenient

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data.cats.js assets/threads data.en.js i18n
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Sync Threads posts $(date -u +%Y-%m-%d)"
          git push
