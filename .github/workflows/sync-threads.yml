# 每三天自動把 Threads 貼文同步到網站（data.js + assets/threads/）
name: Sync Threads

on:
  schedule:
    # 每 3 天 16:10 UTC（台北 00:10）執行
    - cron: "10 16 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-threads
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Sync Threads posts
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node scripts/sync_threads.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js assets/threads
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Sync Threads posts $(date -u +%Y-%m-%d)"
          git push
